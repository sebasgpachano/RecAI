services:
  db:
    image: postgres:17
    container_name: recai-postgres
    environment:
      POSTGRES_DB: recai
      POSTGRES_USER: recai
      POSTGRES_PASSWORD: recai_dev_password
    ports:
      - "5432:5432"
    volumes:
      - recai-pgdata:/var/lib/postgresql/data

volumes:
  recai-pgdata: